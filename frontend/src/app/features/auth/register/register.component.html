<div class="animate-fade-in" style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem 0;">
  <div class="glass-panel" style="width: 100%; max-width: 500px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="color: var(--primary-color);">Create Account</h2>
      <p style="color: var(--text-secondary);">Join us and start shopping</p>
    </div>

    <div *ngIf="error" style="background-color: rgba(239, 68, 68, 0.1); color: var(--danger-color); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; text-align: center;">
      {{ error }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" formControlName="firstName" class="input-field" placeholder="John">
        </div>
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" formControlName="lastName" class="input-field" placeholder="Doe">
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" class="input-field" placeholder="Choose a username">
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" class="input-field" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" class="input-field" placeholder="Minimum 8 characters">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
      Already have an account? <a routerLink="/login">Log in here</a>
    </div>
  </div>
</div>
