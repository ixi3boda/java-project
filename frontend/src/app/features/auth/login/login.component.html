<div class="animate-fade-in" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  <div class="glass-panel" style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="color: var(--primary-color);">Welcome Back</h2>
      <p style="color: var(--text-secondary);">Sign in to continue</p>
    </div>

    <div *ngIf="error" style="background-color: rgba(239, 68, 68, 0.1); color: var(--danger-color); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; text-align: center;">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" class="input-field" placeholder="Enter your username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" class="input-field" placeholder="Enter your password">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
  </div>
</div>
