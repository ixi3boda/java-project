openapi: 3.0.3
info:
  title: Practice Store API
  version: v1
  description: REST API for authentication, users, products, categories, and orders.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Categories
  - name: Products
  - name: Orders
  - name: Users
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      security: []
      requestBody: { $ref: '#/components/requestBodies/RegisterRequest' }
      responses: { '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and obtain a JWT
      security: []
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses: { '200': { description: JWT issued, content: { application/json: { schema: { $ref: '#/components/schemas/Jwt' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/categories:
    get:
      tags: [Categories]
      summary: List categories
      security: []
      responses: { '200': { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
    post:
      tags: [Categories]
      summary: Create a category (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/CategoryRequest' }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/products:
    get:
      tags: [Products]
      summary: List products, optionally by category
      security: []
      parameters: [{ $ref: '#/components/parameters/CategoryId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Product page } }
    post:
      tags: [Products]
      summary: Create a product (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/ProductRequest' }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } } }
  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get a product
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Products]
      summary: Replace a product (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/ProductRequest' }
      responses: { '200': { description: Updated } }
    delete:
      tags: [Products]
      summary: Delete a product (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Deleted } }
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders (ADMIN)
      parameters: [{ name: status, in: query, schema: { type: string, enum: [PENDING, SHIPPED] } }, { name: userId, in: query, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Order page } }
    post:
      tags: [Orders]
      summary: Place an order (USER)
      requestBody: { $ref: '#/components/requestBodies/OrderRequest' }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '400': { description: Invalid order or insufficient stock } }
  /api/orders/my:
    get:
      tags: [Orders]
      summary: List the current user's orders
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: Order page } }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order (owner or ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/OrderStatusRequest' }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } }
  /api/users:
    get:
      tags: [Users]
      summary: List users (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: User page } }
    post:
      tags: [Users]
      summary: Create a user (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/AdminUserCreateRequest' }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user's profile
      responses: { '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
    put:
      tags: [Users]
      summary: Update current user's profile
      requestBody: { $ref: '#/components/requestBodies/UserSelfUpdateRequest' }
      responses: { '200': { description: Updated } }
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
    put:
      tags: [Users]
      summary: Update a user (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/AdminUserUpdateRequest' }
      responses: { '200': { description: Updated } }
    delete:
      tags: [Users]
      summary: Delete a user (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Deleted } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    CategoryId: { name: categoryId, in: query, schema: { type: integer, format: int64 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, default: 20 } }
  responses:
    Unauthorized: { description: Authentication failed }
    Forbidden: { description: Insufficient permission }
    NotFound: { description: Resource not found }
    Conflict: { description: Duplicate resource }
  requestBodies:
    RegisterRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    CategoryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryRequest' } } } }
    ProductRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
    OrderRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderRequest' } } } }
    OrderStatusRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatusRequest' } } } }
    AdminUserCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserCreateRequest' } } } }
    AdminUserUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserUpdateRequest' } } } }
    UserSelfUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserSelfUpdateRequest' } } } }
  schemas:
    User: { type: object, properties: { id: { type: integer, format: int64 }, username: { type: string }, email: { type: string, format: email }, firstName: { type: string }, lastName: { type: string }, roles: { type: array, items: { type: string } } } }
    Category: { type: object, properties: { id: { type: integer, format: int64 }, name: { type: string } } }
    Product: { type: object, properties: { id: { type: integer, format: int64 }, name: { type: string }, description: { type: string }, price: { type: number }, stockQuantity: { type: integer }, categories: { type: array, items: { type: string } } } }
    Order: { type: object, properties: { id: { type: integer, format: int64 }, status: { type: string, enum: [PENDING, SHIPPED] }, orderDate: { type: string, format: date-time }, totalAmount: { type: number }, items: { type: array, items: { type: object } } } }
    Jwt: { type: object, properties: { accessToken: { type: string }, tokenType: { type: string, example: Bearer }, expiresIn: { type: integer, format: int64 } } }
    RegisterRequest: { type: object, required: [username, email, password, firstName, lastName], properties: { username: { type: string }, email: { type: string, format: email }, password: { type: string, format: password }, firstName: { type: string }, lastName: { type: string } } }
    LoginRequest: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, format: password } } }
    CategoryRequest: { type: object, required: [name], properties: { name: { type: string } } }
    ProductRequest: { type: object, required: [name, price, stockQuantity, categoryIds], properties: { name: { type: string }, description: { type: string }, price: { type: number }, stockQuantity: { type: integer }, categoryIds: { type: array, items: { type: integer, format: int64 } } } }
    OrderRequest: { type: object, required: [items], properties: { items: { type: array, items: { type: object, required: [productId, quantity], properties: { productId: { type: integer, format: int64 }, quantity: { type: integer, minimum: 1 } } } } } }
    OrderStatusRequest: { type: object, required: [status], properties: { status: { type: string, enum: [PENDING, SHIPPED] } } }
    AdminUserCreateRequest: { allOf: [{ $ref: '#/components/schemas/RegisterRequest' }, { type: object, required: [roles], properties: { roles: { type: array, items: { type: string } } } }] }
    AdminUserUpdateRequest: { type: object, properties: { email: { type: string, format: email }, firstName: { type: string }, lastName: { type: string }, roles: { type: array, items: { type: string } } } }
    UserSelfUpdateRequest: { type: object, properties: { email: { type: string, format: email }, firstName: { type: string }, lastName: { type: string } } }
